[package]
name = "hibana-tls"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"
description = "Experimental TLS 1.3 for QUIC using Hibana choreography"
repository = "https://github.com/hibanaworks/hibana-tls"
homepage = "https://hibanaworks.dev"
keywords = ["tls", "quic", "choreography", "no-std", "no-alloc"]
categories = ["cryptography", "network-programming", "embedded"]

[dependencies]
hibana = { version = "=0.9.7", default-features = false }

[features]
default = []
alloc = []

[dev-dependencies]
hibana-quic = { path = "../hibana-quic" }
actor-test-allocator = { path = "../hibana-quic/tests/support/actor-test-allocator" }

# Integration tests must use this working tree through QUIC's pinned Git edge.
# Cargo ignores this test-workspace patch when TLS is consumed as a dependency.
[patch."https://github.com/hibanaworks/hibana-tls"]
hibana-tls = { path = "." }
