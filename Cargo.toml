[package]
name = "hibana-tls"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"
description = "Work-in-progress no_std, allocation-free TLS choreography for Hibana"

[dependencies]
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "2eaba16d204a3f33f25ab00087d504380fe7e27f", default-features = false }



[features]
default = []
alloc = []

[dev-dependencies]
hibana-quic = { path = "../hibana-quic" }
actor-test-allocator = { path = "../hibana-quic/tests/support/actor-test-allocator" }

# Integration tests must use this working tree through QUIC's pinned Git edge.
# Cargo ignores this test-workspace patch when TLS is consumed as a dependency.
[patch."https://github.com/hibanaworks/hibana-tls"]
hibana-tls = { path = "." }
